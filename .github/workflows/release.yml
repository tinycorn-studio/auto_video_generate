name: Build and publish installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            asset_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-intel
            asset_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-apple-silicon
            asset_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate tag and changelog
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > /dev/null

      - name: Build installer
        run: npm run tauri:build -- --target "${{ matrix.target }}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Vietnamese release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: release-assets/**/*
          fail_on_unmatched_files: true
