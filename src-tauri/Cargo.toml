[package]
name = "wavely"
version = "0.1.0"
description = "Tạo video dọc từ ảnh và âm thanh"
authors = ["TinyCorn Studio"]
edition = "2021"

[lib]
name = "wavely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
